<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Greeting Header -->
  <header>
    <h1 id="greeting">Welcome!</h1>
    <p id="hint" class="hidden">
      Don't see your name? <a href="start.html">Click here to set your name!</a>
    </p>
  </header>

  <!-- Subject Cards Section -->
  <main>
    <h2>My Subjects</h2>
    
    <div class="card-container">
      <div class="card">
        <h3>Math</h3>
        <p>Algebra and Fractions</p>
      </div>

      <div class="card">
        <h3>Science</h3>
        <p>Solar System & Biology</p>
      </div>

      <div class="card">
        <h3>English</h3>
        <p>Reading & Writing</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
